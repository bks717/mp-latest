<!DOCTYPE html>
<html>
<head>
    <title>Live Disaster AI Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> 
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #disaster-map { height: 100vh; width: 100vw; z-index: 1; } 
        
        /* Our new sleek control panel */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 300px;
        }
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background-color: #cc0029; }
        .live-btn { background-color: #007bff; }
        .live-btn:hover { background-color: #0056b3; }
        
        #status { margin-top: 10px; font-size: 14px; color: #aaa; }
        .tab-bar { display: flex; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .tab { flex: 1; text-align: center; cursor: pointer; color: #888; font-weight: bold;}
        .tab.active { color: white; }
        .panel-section { display: none; }
        .panel-section.active { display: block; }
    </style>
</head>
<body>
    
    <div id="disaster-map"></div>

    <div id="control-panel">
        <h3>🛰️ AI Sat-Scanner</h3>
        
        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('live')">📡 Live Scan</div>
            <div class="tab" onclick="switchTab('upload')">📁 Upload TIF</div>
        </div>
        
        <div id="live-section" class="panel-section active">
            <p style="font-size: 13px; color: #bbb;">Click anywhere on the map to set a target area (10km x 10km), then scan.</p>
            <div id="target-coords" style="font-size: 12px; margin-bottom: 10px; color: #00ffcc;">Target: Not Selected</div>
            <button id="liveScanBtn" class="live-btn">Run Live Satellite Scan</button>
        </div>

        <div id="upload-section" class="panel-section">
            <input type="file" id="imageInput" accept=".tif,.tiff" style="width: 100%; margin-bottom: 10px;">
            <button id="analyzeBtn">Run Local File Analysis</button>
        </div>

        <div id="status">Waiting for input...</div>
    </div>

    <script>
        // 1. Initialize the Base Map
        var map = L.map('disaster-map').setView([20, 0], 3); 
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Removed floodIcon as per user request

        var currentMarkers = L.layerGroup().addTo(map);
        
        // Target Marker Logic
        var targetMarker = null;
        var selectedLat = null;
        var selectedLng = null;
        
        map.on('click', function(e) {
            if(document.getElementById('live-section').classList.contains('active')) {
                selectedLat = e.latlng.lat;
                selectedLng = e.latlng.lng;
                
                if(targetMarker) {
                    map.removeLayer(targetMarker);
                }
                targetMarker = L.circleMarker(e.latlng, {
                    color: '#00ffcc',
                    radius: 8,
                    weight: 3
                }).addTo(map);
                
                document.getElementById('target-coords').innerText = `Target: ${selectedLat.toFixed(4)}, ${selectedLng.toFixed(4)}`;
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
            
            if(tabId === 'live') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('live-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('upload-section').classList.add('active');
            }
        }

        // Shared function to process GeoJSON response
        function renderAIResponse(geojsonData, statusText) {
            if (geojsonData.error) {
                statusText.innerHTML = "❌ " + geojsonData.error;
                return;
            }
        
            if (!geojsonData.features || geojsonData.features.length === 0) {
                statusText.innerHTML = "✅ Area Clear: No Floods Detected.";
                return;
            }

            currentMarkers.clearLayers();

            // Render precise flood polygons
            const geoJsonLayer = L.geoJSON(geojsonData, {
                style: function() {
                    return { color: '#ff4d4d', weight: 2, fillOpacity: 0.5 };
                }
            }).addTo(currentMarkers);

            // Fly to the bounds of all detected polygons
            map.flyToBounds(geoJsonLayer.getBounds(), { padding: [50, 50], maxZoom: 14 });

            statusText.innerHTML = "✅ AI Detection Complete!";
        }

        // 2. The Logic: Live Scan
        document.getElementById('liveScanBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            if (selectedLat === null) return alert("Please click on the map to select a target area first!");

            statusText.innerHTML = "⏳ Searching Microsoft Planetary Computer for live Sentinel-1 data...";
            
            // Create a roughly 10km x 10km bounding box around the click
            // 1 degree lat is ~111km. 10km is ~0.09 degrees. Half is 0.045
            const offsetLat = 0.045;
            // Longitude distance varies by latitude. offset = 10km / (111.32 * cos(lat))
            const offsetLng = 10 / (111.32 * Math.cos(selectedLat * Math.PI / 180)) / 2;
            
            const bbox = [
                selectedLng - offsetLng, // minx (west)
                selectedLat - offsetLat, // miny (south)
                selectedLng + offsetLng, // maxx (east)
                selectedLat + offsetLat  // maxy (north)
            ];

            try {
                const response = await fetch('/api/live-analyze', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bbox: bbox }) 
                });
                const geojsonData = await response.json();
                renderAIResponse(geojsonData, statusText);
            } catch (err) {
                statusText.innerHTML = "❌ Error connecting to backend.";
            }
        });

        // 3. The Logic: Upload File
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const statusText = document.getElementById('status');

            if (fileInput.files.length === 0) return alert("Select an image!");

            statusText.innerHTML = "⏳ Processing Local AI Analysis...";
            const formData = new FormData();
            formData.append('satelliteImage', fileInput.files[0]);

            try {
                const response = await fetch('/api/analyze-satellite', { method: 'POST', body: formData });
                const geojsonData = await response.json();
                renderAIResponse(geojsonData, statusText);
            } catch (err) {
                statusText.innerHTML = "❌ Error in AI pipeline.";
            }
        });
    </script>
</body>
</html>
