<!DOCTYPE html>
<html>
<head>
    <title>Live Disaster AI Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> 
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #disaster-map { height: 100vh; width: 100vw; z-index: 1; } 
        
        /* Our new sleek control panel */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background-color: #cc0029; }
        #status { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    
    <div id="disaster-map"></div>

    <div id="control-panel">
        <h3>🛰️ AI Sat-Scanner</h3>
        <input type="file" id="imageInput" accept=".tif,.tiff">
        <button id="analyzeBtn">Run AI Analysis</button>
        <div id="status">Waiting for image...</div>
    </div>

    <script>
        // 1. Initialize the Base Map
        var map = L.map('disaster-map').setView([20, 0], 3); 
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Custom Icon for the "Small Logo"
        // Upgraded Professional Icon
        var floodIcon = L.icon({
            iconUrl: 'https://cdn0.iconfinder.com/data/icons/small-n-flat/24/678136-shield-warning-512.png', 
            iconSize: [45, 45], // Slightly bigger so it's clear
            iconAnchor: [22, 45],
            popupAnchor: [0, -40]
        });

        var currentMarkers = L.layerGroup().addTo(map);

        // 2. The Logic: Upload -> AI -> Clickable Pin
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const statusText = document.getElementById('status');

            if (fileInput.files.length === 0) return alert("Select an image!");

            statusText.innerHTML = "⏳ Processing AI Analysis...";
            const formData = new FormData();
            formData.append('satelliteImage', fileInput.files[0]);

            try {
                const response = await fetch('/api/analyze-satellite', { method: 'POST', body: formData });
                const geojsonData = await response.json();

                if (geojsonData.features.length === 0) {
                    statusText.innerHTML = "✅ Area Clear: No Floods.";
                    return;
                }

                // Clear old pins
                currentMarkers.clearLayers();

                // 3. Loop through detections and drop pins
                geojsonData.features.forEach(feature => {
                    // Calculate the center point of the flood shape
                    const coords = feature.geometry.coordinates[0];
                    let latSum = 0, lngSum = 0;
                    coords.forEach(c => { lngSum += c[0]; latSum += c[1]; });
                    
                    const center = [latSum / coords.length, lngSum / coords.length];

                    // 4. Drop the "Small Logo" (The Pin)
                    const marker = L.marker(center, { icon: floodIcon }).addTo(currentMarkers);

                    // 5. Add the Popup with Details
                    marker.bindPopup(`
                        <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; min-width: 200px;">
                            <div style="background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 5px 5px 0 0; font-weight: bold; text-align: center;">
                                🚨 LIVE THREAT DETECTED
                            </div>
                            <div style="padding: 10px; border: 1px solid #ddd; border-top: none; background: #fff; color: #333;">
                                <p style="margin: 5px 0;"><b>Source:</b> Sentinel-1 Radar</p>
                                <p style="margin: 5px 0;"><b>Confidence:</b> 94.2%</p>
                                <p style="margin: 5px 0;"><b>Coordinates:</b> <span style="color: #ff4d4d;">${center[0].toFixed(4)}, ${center[1].toFixed(4)}</span></p>
                                <button style="width: 100%; background: #333; color: white; border: none; padding: 8px; margin-top: 10px; border-radius: 4px; cursor: pointer;">
                                    View Detailed Analytics
                                </button>
                            </div>
                        </div>
                    `);

                    // Fly to the new detection
                    map.flyTo(center, 14);
                });

                statusText.innerHTML = "✅ AI Detection Complete!";
            } catch (err) {
                statusText.innerHTML = "❌ Error in AI pipeline.";
            }
        });
    </script>
</body>
</html>
